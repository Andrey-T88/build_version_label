[plugin]

name="Build Version Label"
description="One build counter for the whole project: every run in the editor and every export, on any platform, stamps its numbers into the package, pushes them into the live export preset and raises the next build - with a builds-per-version limit that can either restart the count on a new version or let the code rise forever."
author="andreyt"
version="3.0.0"
script="plugin.gd"
